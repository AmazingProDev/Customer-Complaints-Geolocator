<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SS-COP Analyzer - Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css">
    <link rel="stylesheet" href="./src/login.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="brand-header">
                <h1>SS-COP <span class="highlight">Analyzer</span></h1>
                <p class="subtitle">Open the analyzer from this entry page.</p>
            </div>

            <div class="login-form" aria-label="Application access">
                <div class="access-note">
                    <p>This frontend build does not include real authentication yet.</p>
                    <p>Use the button below to open the web app directly.</p>
                </div>

                <a id="openAppBtn" href="./index.html" class="btn primary full-width access-link">
                    Open Analyzer
                    <span class="arrow">→</span>
                </a>
            </div>

            <div class="login-footer">
                <p>Next improvement: connect this page to real server-side authentication if access control is required.</p>
            </div>
        </div>
    </div>

    <script type="module" src="./src/login.js"></script>
</body>

</html>
